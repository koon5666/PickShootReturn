name = "pickshootreturn-presence"
main = "index.js"
compatibility_date = "2024-09-23"

[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresenceDO"

[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatDO"

[[migrations]]
tag = "v1"
new_classes = ["PresenceDO"]

[[migrations]]
tag = "v2"
new_classes = ["ChatDO"]

# Overdue-gear LINE digest at 09:00 Asia/Bangkok (02:00 UTC). Set the secret
# with `wrangler secret put DIGEST_TOKEN` here AND on the Pages project (same
# value); optional APP_URL var to target another deployment.
[triggers]
crons = ["0 2 * * *"]

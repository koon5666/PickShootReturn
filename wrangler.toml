name = "pickshootreturn"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

[[kv_namespaces]]
binding = "KV"
id = "0023db914404463ba278bc3fa31c4251"

[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresenceDO"
script_name = "pickshootreturn-presence"

[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatDO"
script_name = "pickshootreturn-presence"

# Optional off-site backup copies (P2-7): bind an R2 bucket as BACKUPS and every
# manual / daily version is also written there as psr/<kind>/<date>/<id>.json.
# Without the binding the export is a no-op and backups stay KV-only.
# [[r2_buckets]]
# binding = "BACKUPS"
# bucket_name = "pickshootreturn-backups"
